<style>
:root{--bg:#071B33;--card:#102B50;--sec:#194B78;--lt:#4fc3ff;--ok:#2ecc71;--wn:#f5c542;--bad:#ff5c5c;--free:#3d4b5c;--fg:#eaf2fb;--mut:#92a8c2;--ecn:#7b4fd6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--fg);font:16px/1.4 Arial,Helvetica,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:2px solid var(--sec);position:sticky;top:0;z-index:5}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px}.logo span{color:var(--ok)}small{color:var(--mut);display:block;font-size:11px}
.sp{flex:1}#sync{font-size:12px;color:var(--ok)}#sync.er{color:var(--bad)}
header input{width:120px}
#wrap{display:flex;min-height:calc(100% - 58px)}nav{width:200px;background:var(--card);padding:8px;display:flex;flex-direction:column;gap:6px;transition:width .2s;flex-shrink:0}
nav.c{width:54px}nav.c .t{display:none}nav button{display:flex;align-items:center;gap:10px;padding:12px;border:0;border-radius:10px;background:transparent;color:var(--fg);font-size:15px;text-align:left}
nav button.on{background:var(--sec);box-shadow:inset 3px 0 var(--lt)}main{flex:1;padding:12px;min-width:0}
.btn{padding:14px;border:0;border-radius:10px;background:var(--sec);color:var(--fg);font-size:16px;font-weight:bold}.btn.g{background:var(--ok);color:#052}.btn.w{background:var(--wn);color:#321}.btn.r{background:var(--bad);color:#300}
#burger{background:none;border:0;color:var(--fg);font-size:24px}
.card{background:var(--card);border:1px solid var(--sec);border-radius:12px;padding:12px;margin-bottom:12px}h2{margin:0 0 8px;font-size:17px}
input,select{width:100%;padding:12px;border:1px solid var(--sec);border-radius:10px;background:var(--bg);color:var(--fg);font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--sec);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:30px}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:14px;background:var(--free);border-radius:7px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--lt)}
.fila{display:flex;gap:4px;align-items:center;margin:4px 0;overflow-x:auto}.fila>b{min-width:54px;font-size:12px;color:var(--mut)}
.v{min-width:52px;height:50px;border:2px solid transparent;border-radius:8px;background:var(--free);color:var(--fg);font-size:11px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.v b{font-size:13px}.v.o{background:#2f80c8}.v.p{background:var(--wn);color:#321}.v.k{background:var(--ok);color:#052}.v.e{border-color:var(--ecn)}.v.s{outline:3px solid var(--lt)}
.leg span{display:inline-block;margin-right:10px;font-size:12px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:110px}.seg .on{background:var(--lt);color:#012}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--sec)}.mut{color:var(--mut);font-size:13px}.hide{display:none!important}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}#modal .card{width:100%;max-width:440px;margin:0}
#msg{margin-top:8px;font-weight:bold}.ok{color:var(--ok)}.er{color:var(--bad)}
@media(max-width:700px){nav{width:54px}nav .t{display:none}nav:not(.c).open{width:200px}nav.open .t{display:inline}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--sec);text-align:left}th{color:var(--mut)}.tw{overflow-x:auto}
#lg{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#lg .card{width:100%;max-width:380px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips2{display:flex;gap:6px;flex-wrap:wrap}#sync.cl{cursor:pointer;text-decoration:underline}
@media print{header,nav,.np,#modal,#lg{display:none!important}body{background:#fff;color:#000}.card{border:0;background:#fff}section:not(#v-rel){display:none!important}th,td{color:#000;border-color:#999}}
</style></head><body>
<div id="lg"><div class="card"><div class="logo" style="margin-bottom:10px">OBT <span>CONTROL</span></div><label style="margin-top:0">Matrícula</label><input id="lm" inputmode="numeric"><label>PIN</label><input id="lp" type="password" inputmode="numeric"><button class="btn g" style="width:100%;margin-top:12px" id="lb">Entrar</button><div id="lmsg" class="er" style="margin-top:8px"></div></div></div>
<header><button id="burger">☰</button>
<svg width="38" height="26" viewBox="0 0 38 26" fill="none" stroke="#4fc3ff" stroke-width="2"><path d="M3 18l3-8c1-2 3-3 5-3h14c2 0 4 1 5 3l3 8v4h-4M3 18v4h4M3 18h32"/><circle cx="11" cy="22" r="3"/><circle cx="27" cy="22" r="3"/></svg>
<div><div class="logo">OBT <span>CONTROL</span></div><small>Gestão Inteligente de Pátio</small></div><div class="sp"></div>
<div style="text-align:right"><span id="sync">…</span><small id="usr"></small></div><button class="btn np" style="padding:8px 10px;font-size:13px" id="out">Sair</button></header>
<div id="wrap"><nav id="nav"></nav><main>
<section id="v-dash"></section><section id="v-mapa" class="hide"></section>
<section id="v-receb" class="hide"><div class="card"><h2>RECEBIMENTO / MOVIMENTAÇÃO</h2>
 <label style="margin-top:0">1. Setor</label><div class="seg" id="setSeg"></div>
 <label>2. VIS (câmera ou digitação manual)</label><input id="vis" autocapitalize="characters" autocomplete="off" placeholder="Bipe ou digite o VIS">
 <button class="btn" style="width:100%;margin-top:8px" id="bCam">📷 Ler VIS com a câmera</button><div id="reader" class="hide" style="margin-top:8px"></div>
 <div id="recInfo" class="mut" style="margin-top:8px"></div>

 <label>3. Fila e vaga (toque na vaga livre)</label><div id="pick"></div><div class="card" style="margin:10px 0 0" id="sum"></div>
 <button class="btn g" style="width:100%;margin-top:10px" id="bOk">✔ Confirmar registro</button><div id="msg"></div></div></section>

 <select id="ht"></select><select id="hs"></select><select id="hf"></select><select id="hc"></select><select id="hst"></select><select id="ha"></select></div></div><div class="card" id="hOut"></div></section>
<section id="v-rel" class="hide"><div class="card np"><h2>Relatórios</h2><select id="rt"></select>
 <div class="g2"><div><label>De</label><input type="date" id="r1"></div><div><label>Até</label><input type="date" id="r2"></div></div>
 <div class="chips2" style="margin-top:10px"><button class="btn" data-x="csv">CSV</button><button class="btn" data-x="xlsx">Excel</button><button class="btn" data-x="pdf">PDF</button><button class="btn" data-x="print">Imprimir</button><button class="btn" data-x="ocup">Imprimir ocupação do pátio</button></div></div>
 <div class="card"><h2 id="rTit"></h2><div class="tw" id="rOut"></div></div></section>
<section id="v-acoes" class="hide">
 <div class="card"><h2>AÇÕES DE PÁTIO</h2><select id="acS"></select><div id="acCnt" class="mut" style="margin-top:6px"></div>
  <label>VIS (bipe ou digite e confirme com Enter)</label><input id="acV" autocapitalize="characters" autocomplete="off">
  <button class="btn" style="width:100%;margin-top:8px" id="acCam">📷 Ler VIS com a câmera</button><div id="acReader" class="hide" style="margin-top:8px"></div>
  <div id="acCard"></div><div id="acMsg" style="margin-top:8px;font-weight:bold"></div></div>
 <div class="card"><div class="seg"><button class="btn on" data-at="pend">Pendentes</button><button class="btn" data-at="feit">Feitos</button></div><input id="acQ" placeholder="Filtrar VIS" style="margin-top:8px"><div id="acL"></div></div>
 <div class="card" id="acAdm" style="display:none"><h2>Gerenciar ações (administrador)</h2>
  <div class="g2"><input id="acN" placeholder="Nome da nova ação"><input id="acD" placeholder="Descrição (opcional)"></div>
  <label>Carros da ação (um VIS por linha)</label><textarea id="acT" rows="4" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--sec);background:var(--bg);color:var(--fg);font-size:15px"></textarea>
  <label>Incluir também os veículos que estão no pátio</label><select id="acSet"><option value="">Nenhum</option><option value="ALL">Todos os setores</option><option>Frente Ateliê</option><option>Frente Ducha</option><option>ECON</option></select>
  <div class="g2" style="margin-top:8px"><button class="btn g" id="acNew">Criar ação</button><button class="btn" id="acAdd">Adicionar à ação selecionada</button></div>
  <button class="btn w" style="width:100%;margin-top:8px" id="acEnc">Encerrar / reativar ação selecionada</button><div id="acM2" class="er" style="margin-top:6px"></div></div>
</section>
<section id="v-adm" class="hide"></section>
</main></div><div id="modal" class="hide"></div>
<script>
/* ===== Cole aqui a MESMA URL do Apps Script usada no Campanhas (termina em /exec) ===== */
const API_URL="https://script.google.com/macros/s/AKfycbyWvUNdKZ_gHnGXDe2AjrXkuo3R9-v0qMzbcaGazuRKjtmqJcIM-a3hoe6_IBLlrjkn5w/exec";
/* ======================================================================================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const split=s=>String(s||"").split(/\s*,\s*/).filter(Boolean);
const fmt=t=>{try{return new Date(t).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}catch(e){return t}};
const iso=t=>new Date(t).toLocaleDateString("sv-SE");
const LET="ABCDEFGHIJKLMNOPQRSTUVWXYZ",SET=["Frente Ateliê","Frente Ducha","ECON"],RK={OPERADOR:1,LIDER:2,ADMIN:3};
const ST={pendente:"Aguardando campanha",last_mile:"LAST MILE (finalizado)",liberado:"Liberado",em_atendimento:"Em processo"};
const FIM=c=>c&&(c.status==="last_mile"||c.status==="liberado");
let A=null,L=[],P={},O={},PA=[],cars={},checks=[],hist=[],param={},campCfg=[],scanner=null,sel={setor:SET[0],vaga:""},filtro="",view="dash",busy=false,booted=false,Q=[],F=[],off=false,rcur=null,tm=null;
try{A=JSON.parse(sessionStorage.getItem("a")||"null")}catch(e){}
try{Q=JSON.parse(localStorage.getItem("q")||"[]");F=JSON.parse(localStorage.getItem("f")||"[]")}catch(e){}
let ACT=[],AVr=[],AVm={},acSel="",acTab="pend";
const saveQ=()=>{try{localStorage.setItem("q",JSON.stringify(Q));localStorage.setItem("f",JSON.stringify(F))}catch(e){}};
const R=()=>A?RK[A.perfil]||0:0,mat=()=>A?A.mat:"",uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"square";o.frequency.value=ok?880:180;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(ok?.15:.4));navigator.vibrate&&navigator.vibrate(ok?60:[120,60,120])}catch(e){}}

/* ---------- login / menu ---------- */
const MENU=[["dash","📊","Dashboard","",2],["mapa","🗺️","Mapa do Pátio","",1],["receb","📷","Recebimento","",1],["mapa","🅰️","Frente Ateliê","Frente Ateliê",1],["mapa","🚿","Frente Ducha","Frente Ducha",1],["mapa","⭐","ECON","ECON",1],["cons","🔎","Consulta","",1],["acoes","🛠️","Ações de Pátio","",1],["receb","🔁","Movimentação","",1],["camp","📋","Campanhas","",1],["hist","🕘","Histórico","",2],["rel","📑","Relatórios","",2],["adm","⚙️","Administração","",3]];
function start(){$("lg").classList.add("hide");$("usr").textContent=A.nome+" · "+A.perfil+" · "+A.mat;
 $("nav").innerHTML=MENU.map((m,i)=>R()>=m[4]?`<button data-i="${i}"><span>${m[1]}</span><span class="t">${m[2]}</span></button>`:"").join("");
 booted=false;load();clearInterval(tm);tm=setInterval(()=>{if(!document.hidden&&!busy&&!scanner)load()},10000)}
$("lb").onclick=async()=>{const m=$("lm").value.replace(/\D/g,""),p=$("lp").value;$("lmsg").textContent="";if(!m||!p){$("lmsg").textContent="Informe matrícula e PIN.";return}
 try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",auth:{mat:m,pin:p}})});const j=await r.json();
  if(!j.ok)throw new Error(j.error);A={mat:m,pin:p,nome:j.user.nome||m,perfil:j.user.perfil};sessionStorage.setItem("a",JSON.stringify(A));$("lp").value="";start()}
 catch(e){$("lmsg").textContent=/^https:\/\/script\.google\.com\//.test(API_URL)?(e.message||"Falha de conexão"):"API_URL não configurada"}};
$("out").onclick=()=>{if(Q.length&&!confirm(Q.length+" operação(ões) ainda não sincronizada(s). Sair mesmo assim?"))return;A=null;sessionStorage.removeItem("a");clearInterval(tm);$("lg").classList.remove("hide")};
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;const m=MENU[b.dataset.i];if(m[0]==="camp"){location.href="./index.html";return}go(m[0],m[3],b.dataset.i)};
$("burger").onclick=()=>{$("nav").classList.toggle("c");$("nav").classList.toggle("open")};if(innerWidth<700)$("nav").classList.add("c");
function go(v,f,i){view=v;filtro=f||"";["dash","mapa","receb","cons","acoes","hist","rel","adm"].forEach(x=>$("v-"+x).classList.toggle("hide",x!==v));
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.i===String(i??MENU.findIndex(m=>m[0]===v))));stopScan();render()}

/* ---------- rede, fila offline ---------- */
const call=async b=>(await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...b,auth:{mat:A.mat,pin:A.pin}})})).json();
async function post(b,q){
 if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error("API_URL não configurada");
 if(q)b={...b,opId:uid(),opMat:A.mat};let j;
 try{j=await call(b)}catch(e){if(q&&e instanceof TypeError){Q.push({body:b,ts:new Date().toISOString()});saveQ();applyQ();off=true;setSync();render();beep(1);return{queued:true}}throw new Error("Falha de conexão. Tente novamente.")}
 if(!j.ok){beep(0);throw new Error(j.error||"erro")}beep(1);await load();return j}
async function flush(){while(Q.length&&A){const it=Q[0];let j;try{j=await call(it.body)}catch(e){return}
 if(!j.ok&&/PIN inválidos/.test(j.error||""))return;if(!j.ok)F.push({...it,error:j.error});Q.shift();saveQ()}}
function applyQ(){Q.forEach(it=>{if(it.body.action==="acao_fazer"){const r=AVm[it.body.acaoId+"|"+key(it.body.vis)];if(r&&!r.resultado){r.resultado=it.body.resultado;r.feitoEm=it.ts;r.matricula=it.body.opMat}return}const b=it.body,v=key(b.vis),o=P[v];if(o)delete O[o.setor+"|"+o.vaga];if(b.action==="saida"){delete P[v];return}
 const r={vis:v,setor:b.setor,vaga:b.vaga,entrada:o?o.entrada:it.ts,operador:o?o.operador:b.opMat,status:"no_patio",econ:o?o.econ:(b.econ?"SIM":"NÃO")};P[v]=r;O[r.setor+"|"+r.vaga]=r})}
function setSync(msg){const e=$("sync");let t,c="";
 if(Q.length){t="⏳ "+Q.length+" pendente(s) de sincronização";c="er"}else if(off){t="● Sem conexão"+(msg?" · "+msg:"");c="er"}else t="● Online · sincronizado "+new Date().toLocaleTimeString("pt-BR",{timeStyle:"short"});
 if(F.length){t+=" · ⚠ "+F.length+" falha(s)";c="er cl"}e.textContent=t;e.className=c}
$("sync").onclick=()=>{if(!F.length)return;$("modal").classList.remove("hide");$("modal").innerHTML=`<div class="card"><h2>Operações não sincronizadas</h2>${F.map((f,i)=>`<div class="row"><div><b>${esc(f.body.vis)}</b> · ${esc(f.body.action)}<div class="er">${esc(f.error)}</div></div><button class="btn sm" data-x="${i}">Descartar</button></div>`).join("")}<button class="btn" style="width:100%;margin-top:8px" id="mFec">Fechar</button></div>`;
 $("mFec").onclick=()=>$("modal").classList.add("hide");document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{F.splice(+b.dataset.x,1);saveQ();setSync();$("sync").click()})};
window.addEventListener("online",()=>load());
async function load(){if(!A)return;
 try{await flush();const j=await(await fetch(API_URL)).json();if(!j.layout)throw new Error("Code.gs desatualizado");
  L=j.layout;PA=j.patio;cars={};j.cars.forEach(c=>cars[c.vis]=c);checks=j.checks||[];hist=j.hist||[];param=j.param||{};ACT=j.acoes||[];AVr=j.acoesCarros||[];AVm={};AVr.forEach(r=>AVm[r.acaoId+"|"+r.vis]=r);campCfg=(j.config||{}).campanha||[];
  P={};O={};PA.filter(r=>r.status==="no_patio").forEach(r=>{P[r.vis]=r;O[r.setor+"|"+r.vaga]=r});applyQ();off=false;setSync();
  if(!booted){booted=true;go(R()>=2?"dash":"receb")}else render();
 }catch(e){off=true;setSync(e.message)}}

/* ---------- pátio ---------- */
const pre=s=>s==="ECON"?"E":"F";
const filas=s=>{const l=L.find(x=>x.setor===s);return l?[...Array(l.filas)].map((_,f)=>[...Array(l.vagas)].map((_,i)=>pre(s)+(f+1)+LET[i])):[]};
const cap=s=>filas(s).flat().length;
function cls(s,v){const o=O[s+"|"+v];if(!o)return"v";const c=cars[o.vis];return"v "+(c&&c.status==="pendente"?"p":FIM(c)?"k":"o")}
const cell=(s,v,x)=>{const o=O[s+"|"+v];return `<button class="${cls(s,v)}${s==="ECON"?" e":""}${x||""}" data-s="${esc(s)}" data-v="${v}"><b>${v}</b>${o?esc(o.vis.slice(-6)):"livre"}</button>`};
function render(){({dash,mapa,receb,cons,acoes,hist:histR,rel,adm}[view]||(()=>{}))()}
const TU=()=>[1,2,3].map(i=>(param["turno"+i]||"").match(/^(\d\d):(\d\d)-(\d\d):(\d\d)$/)).map((m,i)=>m?{n:(i+1)+"º Turno",a:+m[1]*60+ +m[2],b:+m[3]*60+ +m[4]}:null).filter(Boolean);
function turno(ts){const d=new Date(ts),t=d.getHours()*60+d.getMinutes();for(const x of TU())if(x.a<=x.b?(t>=x.a&&t<x.b):(t>=x.a||t<x.b))return x.n;return"Fora de turno"}
const ent=()=>hist.filter(h=>h.acao==="ENTRADA PÁTIO");
const bar=(t,a,b,c)=>`<div class="mut">${esc(t)} · ${a}${b!=null?"/"+b:""}</div><div class="bar"><i style="width:${b?Math.min(100,Math.round(a/b*100)):0}%${c?";background:"+c:""}"></i></div>`;

function dash(){const vs=Object.values(P),n=s=>vs.filter(r=>r.setor===s).length,all=SET.reduce((a,s)=>a+cap(s),0),st=k=>vs.filter(r=>(cars[r.vis]||{}).status===k).length;
 const hoje=iso(new Date()),eh=ent().filter(h=>iso(h.ts)===hoje),tn={};eh.forEach(h=>{const t=turno(h.ts);tn[t]=(tn[t]||0)+1});

const parseVis=()=>{const a=$("acT").value.split(/[\s,;]+/).map(key).filter(Boolean),t=$("acSet").value,x=t?Object.values(P).filter(p=>t==="ALL"||p.setor===t).map(p=>p.vis):[];return[...new Set([...a,...x])]};
async function acAdm(b,after){try{$("acM2").textContent="";const j=await post(b);if(after)after(j)}catch(e){$("acM2").textContent=e.message}}
$("acL").onclick=e=>{const b=e.target.closest("[data-ad]");if(!b||!confirm((b.dataset.ad==="acao_rm"?"Remover ":"Reabrir ")+b.dataset.v+"?"))return;acAdm({action:b.dataset.ad,acaoId:acSel,vis:b.dataset.v})};
$("acNew").onclick=()=>{if(!$("acN").value.trim()){$("acM2").textContent="Informe o nome da ação.";return}acAdm({action:"acao_set",nome:$("acN").value,descricao:$("acD").value,vis:parseVis()},j=>{acSel=j.id;$("acN").value=$("acD").value=$("acT").value="";$("acSet").value="";$("acM2").textContent="";acoes()})};
$("acAdd").onclick=()=>{if(!acSel){$("acM2").textContent="Selecione uma ação.";return}acAdm({action:"acao_set",id:acSel,vis:parseVis()},j=>{$("acT").value="";$("acSet").value="";alert(j.adicionados+" veículo(s) adicionado(s).")})};
$("acEnc").onclick=()=>{const a=ACT.find(x=>x.id===acSel);if(!a)return;acAdm({action:"acao_set",id:acSel,ativa:a.status==="encerrada"})};

/* ---------- administração ---------- */
let users=[];
async function adm(){if(R()<3){$("v-adm").innerHTML='<div class="card mut">Somente administradores.</div>';return}
 try{users=(await call({action:"usr_list"})).users||[]}catch(e){users=[]}
 $("v-adm").innerHTML=`<div class="card"><h2>Usuários</h2>${users.map(u=>`<div class="row"><div><b>${esc(u.nome||u.matricula)}</b> · ${esc(u.perfil)}<div class="mut">mat. ${esc(u.matricula)} · ${u.ativo==="NÃO"?"inativo":"ativo"}</div></div><button class="btn sm" data-u="${esc(u.matricula)}">Editar</button></div>`).join("")||'<span class="mut">Nenhum usuário cadastrado.</span>'}
 <h2 style="margin-top:12px">Novo / editar usuário</h2><div class="g2"><input id="um" placeholder="Matrícula" inputmode="numeric"><input id="un" placeholder="Nome"><select id="up"><option>OPERADOR</option><option>LIDER</option><option>ADMIN</option></select><input id="ux" type="password" placeholder="PIN (4 a 8 dígitos)" inputmode="numeric"></div>
 <label><input type="checkbox" id="ua" checked style="width:auto"> Ativo</label><button class="btn g" style="width:100%;margin-top:8px" id="us">Salvar usuário</button><div class="mut">Deixe o PIN em branco ao editar para mantê-lo. LIDER = Team Leader.</div></div>
 <div class="card"><h2>Layout do pátio</h2><div class="mut">Filas de 1 a 30 e vagas por fila de 1 a 14. Reduzir a grade não apaga registros.</div>
 ${L.map((l,i)=>`<div class="row" style="align-items:end"><b style="min-width:110px">${esc(l.setor)}</b><div><label>Filas</label><input type="number" min="1" max="30" value="${l.filas}" id="f_${i}"></div><div><label>Vagas/fila</label><input type="number" min="1" max="14" value="${l.vagas}" id="g_${i}"></div><button class="btn" data-l="${i}">Salvar</button></div>`).join("")}</div>
 <div class="card"><h2>Turnos (hh:mm-hh:mm)</h2>${[1,2,3].map(i=>`<div class="row" style="align-items:end"><b style="min-width:80px">${i}º turno</b><input id="t${i}" value="${esc(param["turno"+i]||"")}" placeholder="${i<3?"06:00-14:00":"opcional"}"><button class="btn" data-t="${i}">Salvar</button></div>`).join("")}</div><div id="am" class="er"></div>`;
 const run=async b=>{try{$("am").textContent="";await post(b)}catch(e){$("am").textContent=e.message}};
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const u=users.find(x=>x.matricula===b.dataset.u);$("um").value=u.matricula;$("un").value=u.nome;$("up").value=u.perfil;$("ua").checked=u.ativo!=="NÃO";$("ux").value=""});
 $("us").onclick=()=>run({action:"usr_set",mat:$("um").value,nome:$("un").value,perfil:$("up").value,novoPin:$("ux").value,ativo:$("ua").checked});
 document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>run({action:"layout",setor:L[b.dataset.l].setor,filas:$("f_"+b.dataset.l).value,vagas:$("g_"+b.dataset.l).value}));
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>run({action:"param_set",chave:"turno"+b.dataset.t,valor:$("t"+b.dataset.t).value.trim()}))}
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.add("hide")};
if(A)start();
</script></body></html>
